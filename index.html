<!DOCTYPE html> <!--o DocType indica a linguagem de programação que está sendo usado-->
<html lang="pt-br"> <!--início do código-->
<head> <!--início do cabeçalho do documento. Dentro dessa tag pode ser inseridas folhas de estilo e scripts-->
    <meta charset="UTF-8"> <!-- indica qual será os caracteres (character set ou charset) será utilizado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio</title> <!-- título do projeto-->
</head> <!-- fim do cabeçalho do documento -->
<body> <!-- nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões e outros devem ser adicionadas nesse intervalo.-->
    <!--Um documento HTMLL é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como o caso da tag meta. Outro aspecto importante da linguagem é que ela é case insensitive, ou seja, não leva em consideraçãona diferença entre letras oficiais e minúsculas. -->
 <!-- No HTML há seis níveis de cabeçalhos/títulos que podem ser usados por meios da tags h1, h2, h3, h4, h5 e h6, sendo o h1 o maior e mais relevante e o h6 menos/menos relevante.  -->
<h1> Portifólio </h1>
<h2> Programação </h2>
<h3> HTML</h3>
<h4> CSS</h4>
<h5></h5>
</body> <!--fechamento da tag.-->
</html> <!--fim do código-->
